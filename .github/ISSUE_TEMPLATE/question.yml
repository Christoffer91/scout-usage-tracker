name: Question
description: Ask about installation, configuration, or reported values
title: "[Question]: "
labels:
  - question
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: Include enough context to answer without private usage data.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Installation or update
        - Dashboard
        - /cost skill
        - Credits or estimates
        - Privacy
        - Other
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I did not include a database, prompts, raw IDs, credentials, private paths, or personal usage values.
          required: true
